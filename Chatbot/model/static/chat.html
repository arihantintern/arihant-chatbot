<!DOCTYPE html>
<html>
<head>
  <title>Arihant Chatbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      padding-top: 40px;
    }
    .chatbox {
      width: 450px;
      height: 600px;
      background: white;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 20px #0002;
    }
    header {
      background: #2563eb;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 22px;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }
    .message {
      margin: 10px 0;
      padding: 12px;
      border-radius: 10px;
      white-space: pre-wrap;
    }
    .user { background: #dbeafe; }
    .bot { background: #f1f5f9; }
    .input-area {
      display: flex;
      padding: 12px;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 12px;
      min-width: 0;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="chatbox">
    <header>chat</header>
    <div id="messages">
      <div class="message bot">
        Hello! How can I help you?
      </div>
    </div>
    <div class="input-area">
      <input id="question"
             placeholder="Ask your question..."
             onkeydown="if(event.key==='Enter') sendMessage()">
      <button type="button" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
       const input = document.getElementById("question");
       const question = input.value.trim();

      if (!question) return;

      addMessage(question, "user");
      input.value ="";

    const token = "ursBp040-YFGL_A6tX8rz4SbOUljUvmmBUty2b8JvXE";

    try {
        const response = await fetch("/shared-chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "x-chat-token": token
            },
            body: JSON.stringify({ question: question })
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        console.log("API Response:", data);

        addMessage(data.response ?? data.answer ?? "No answer", "bot");

    } catch (error) {
        addMessage("Error: " + error.message, "bot");
    }
}

function addMessage(text, type) {
      const messages = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
